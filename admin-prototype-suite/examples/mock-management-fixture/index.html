<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理平台 Mock Fixture</title><style>body{font:14px system-ui;background:#f4f7fb;color:#23344b;margin:0}header{background:white;padding:18px 32px;border-bottom:1px solid #ddd}main{max-width:950px;margin:28px auto;background:white;padding:24px;border:1px solid #e0e5ef;border-radius:9px}button,input{font:inherit;padding:8px;margin:4px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #eee;padding:12px}dialog{border:1px solid #d9e0eb;border-radius:10px;min-width:320px}label{display:block;margin:10px 0}</style></head><body><header>设备管理 Mock 演示夹具（非生产后端）</header><main><h1>设备列表</h1><label>名称搜索 <input id="search"></label><button id="reset">重置</button><button id="create">新增设备</button><button id="restore">恢复测试数据</button><p id="feedback" role="status" aria-live="polite"></p><table><thead><tr><th>编号</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><h2>已发布快照</h2><pre id="snapshot"></pre></main><dialog id="editor"><form id="form"><h2 id="modalTitle">新增设备</h2><label>设备名称 <input id="name" required maxlength="40"></label><p id="editError" role="alert"></p><button id="cancel" type="button">取消</button><button id="save" type="submit">保存</button></form></dialog><script>
const seed=()=>[{id:'dev-001',name:'风机 A',status:'启用',references:1},{id:'dev-002',name:'传感器 B',status:'启用',references:0}];
let entities=seed(),published=null,editing=null,draft=null,nextId=3,failure=false;
const $=id=>document.getElementById(id);const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function notify(m){$('feedback').textContent=m}
function render(){let q=$('search').value.trim().toLowerCase();$('rows').innerHTML=entities.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<tr data-id="${x.id}"><td>${safe(x.id)}</td><td>${safe(x.name)}</td><td>${safe(x.status)}</td><td><button data-action="detail" data-id="${x.id}">详情</button><button data-action="edit" data-id="${x.id}">编辑</button><button data-action="delete" data-id="${x.id}">删除</button><button data-action="publish" data-id="${x.id}">发布</button></td></tr>`).join('')||'<tr><td colspan="4">暂无数据</td></tr>';$('snapshot').textContent=published?JSON.stringify(published,null,2):'尚未发布'}
function openEditor(id){editing=id;let x=entities.find(x=>x.id===id);draft=x?structuredClone(x):{id:'dev-'+String(nextId).padStart(3,'0'),name:'',status:'启用',references:0};$('name').value=draft.name;$('modalTitle').textContent=x?'编辑设备':'新增设备';$('editError').textContent='';$('editor').showModal();$('name').focus()}
$('create').onclick=()=>openEditor(null);$('cancel').onclick=()=>{draft=null;$('editor').close();notify('已取消，数据未修改')};
$('form').onsubmit=e=>{e.preventDefault();if(!draft)return;let n=$('name').value.trim();if(!n){$('editError').textContent='名称不能为空';return}if(entities.some(x=>x.name===n&&x.id!==editing)){$('editError').textContent='名称已存在';return}if(failure){notify('模拟保存失败');return}draft.name=n;if(editing){entities=entities.map(x=>x.id===editing?structuredClone(draft):x)}else{entities.push(structuredClone(draft));nextId++}draft=null;$('editor').close();notify('保存成功');render()};
$('rows').onclick=e=>{let b=e.target.closest('button[data-action]');if(!b)return;let id=b.dataset.id,x=entities.find(v=>v.id===id);if(!x)return;if(b.dataset.action==='detail')notify(`详情：${x.id} / ${x.name}`);if(b.dataset.action==='edit')openEditor(id);if(b.dataset.action==='delete'){if(x.references){notify('删除失败：设备仍被工单引用');return}entities=entities.filter(v=>v.id!==id);notify('删除成功');render()}if(b.dataset.action==='publish'){published=structuredClone(x);notify('发布成功');render()}};
$('search').oninput=render;$('reset').onclick=()=>{$('search').value='';render()};$('restore').onclick=()=>{entities=seed();published=null;draft=null;nextId=3;failure=false;$('search').value='';notify('已恢复');render()};
window.mockTest={setFailure:v=>failure=!!v,getEntities:()=>structuredClone(entities),getPublished:()=>structuredClone(published)};render();
</script></body></html>
